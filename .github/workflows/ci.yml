name: CI Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Build and Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and Mercury
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl gcc make
          # Verify Python and C tooling availability
          python3 --version
          gcc --version

      - name: Verify absence of forbidden punctuation
        run: |
          python3 scripts/verify_no_em_dashes.py

      - name: Run Python verification suites
        run: |
          python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify TLE datasets integrity
        run: |
          python3 tools/tle_validator.py data/constellations/sentinel2.tle
          python3 tools/tle_validator.py data/constellations/planet_flock.tle
          python3 tools/tle_validator.py data/constellations/walker_48_4_1.tle
