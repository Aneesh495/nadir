name: CI Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Build and Verify
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and Mercury
        run: |
          curl -fsSL https://paul.bone.id.au/paul.asc | sudo tee /usr/share/keyrings/nadir-mercury.asc >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/nadir-mercury.asc] https://dl.mercurylang.org/deb/ noble main' | sudo tee /etc/apt/sources.list.d/nadir-mercury.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y build-essential mercury-recommended
          mmc --version

      - name: Verify absence of forbidden punctuation
        run: |
          python3 scripts/verify_no_em_dashes.py

      - name: Build and run the Mercury test runner
        run: |
          make all
          bin/test_runner

      - name: Run Python verification suites
        run: |
          python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify TLE datasets integrity
        run: |
          python3 tools/tle_validator.py data/constellations/sentinel2.tle
          python3 tools/tle_validator.py data/constellations/planet_flock_24.tle
          python3 tools/tle_validator.py data/constellations/walker_delta_24.tle
